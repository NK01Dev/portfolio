<div class="relative inline-block text-left">
  <!-- Toggle Button (Medium Sized) -->
  <button
    #languageToggle
    id="language-toggle"
    (click)="toggleDropdown()"
    class="flex items-center gap-2 bg-transparent hover:bg-black/5 dark:hover:bg-white/10 text-gray-900 dark:text-white focus:outline-none rounded-full px-3.5 py-2 md:px-4 md:py-2 text-sm md:text-[15px] font-semibold transition-all duration-200 ease-in-out border border-gray-300/80 dark:border-white/20 shadow-sm"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="true"
  >
    <!-- Globe Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-75 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-.778.099-1.533.284-2.253" />
    </svg>

    <!-- Current Language -->
    <ng-container *ngFor="let lang of languageService.languages">
      <ng-container *ngIf="lang.code === (languageService.currentLang$ | async)">
        <span class="inline uppercase tracking-wide text-xs md:text-sm font-bold">{{ lang.code }}</span>
      </ng-container>
    </ng-container>

    <!-- Dropdown Chevron -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4 opacity-60 transition-transform duration-200 shrink-0"
      [class.rotate-180]="isOpen"
      viewBox="0 0 20 20"
      fill="currentColor"
    >
      <path
        fill-rule="evenodd"
        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  <div
    #languageDropdown
    id="language-dropdown"
    *ngIf="isOpen"
    class="absolute right-0 sm:left-0 mt-2 w-40 rounded-2xl bg-white dark:bg-zinc-900 shadow-2xl border border-gray-200/80 dark:border-zinc-800 focus:outline-none z-50 overflow-hidden py-1.5 backdrop-blur-md"
    role="menu"
    aria-orientation="vertical"
    aria-labelledby="language-toggle"
  >
    <!-- Language Options -->
    <button
      *ngFor="let lang of languageService.languages"
      (click)="selectLanguage(lang.code)"
      class="flex items-center justify-between w-full px-4 py-2.5 text-sm md:text-[15px] font-medium text-gray-800 dark:text-gray-100 hover:bg-indigo-50 dark:hover:bg-zinc-800/80 transition-colors duration-150 text-left"
      [class.font-bold]="lang.code === (languageService.currentLang$ | async)"
      [class.text-indigo-600]="lang.code === (languageService.currentLang$ | async)"
      [class.dark:text-indigo-400]="lang.code === (languageService.currentLang$ | async)"
      role="menuitem"
    >
      <span>{{ lang.label }}</span>

      <!-- Selected Language Checkmark -->
      <svg
        *ngIf="lang.code === (languageService.currentLang$ | async)"
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4 text-indigo-600 dark:text-indigo-400"
        viewBox="0 0 20 20"
        fill="currentColor"
      >
        <path
          fill-rule="evenodd"
          d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>
</div>
