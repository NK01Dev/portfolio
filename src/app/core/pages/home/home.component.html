<div class="relative justify-center bg-gradient-to-b from-indigo-200 to-pink-200 dark:bg-gradient-to-b dark:from-[#4a4e69] dark:to-[#22223b] text-white">

    <!-- ══════════════════════════════════════════════════════
         SECTION 1: HERO (#home)
         ══════════════════════════════════════════════════════ -->
    <section id="home"
        class="page-content home-section relative min-h-[100svh] w-full flex flex-col justify-center overflow-hidden">
        
        <!-- Layer 0: Full-screen Background Video -->
        <video
            [src]="currentVideo"
            [poster]="currentPoster"
            [autoplay]="shouldAutoplay"
            [muted]="true"
            [loop]="true"
            [playsInline]="true"
            preload="metadata"
            aria-hidden="true"
            tabindex="-1"
            class="absolute inset-0 w-full h-full object-cover object-center z-0 pointer-events-none">
        </video>

        <!-- Layer 1: Atmospheric Tint & Directional Contrast Overlays -->
        <div class="absolute inset-0 z-10 pointer-events-none bg-slate-900/20 dark:bg-black/40"></div>
        <div class="absolute inset-0 z-10 pointer-events-none bg-gradient-to-r from-indigo-100/90 via-indigo-50/75 to-transparent dark:from-[#22223b]/95 dark:via-[#22223b]/75 dark:to-transparent"></div>

        <!-- Layer 2: Hero Floating Content -->
        <div class="relative z-20 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-12 py-24 md:py-32 flex flex-col justify-center">
            <div class="max-w-3xl flex flex-col items-start text-left">
                <h1 class="home-section text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold text-gray-900 dark:text-white tracking-tight leading-tight drop-shadow-sm">
                    Kamal Naim
                </h1>
                
                <h2 id="typewriter"
                    class="text-2xl sm:text-3xl md:text-4xl font-semibold text-gray-800 dark:text-gray-100 mt-4 leading-relaxed">
                    {{ 'home.welecomeMessage' | translate }} <span class="text-indigo-600 dark:text-indigo-400 font-bold underline decoration-indigo-400/40">{{ displayText }}</span>
                </h2>

                <!-- Action CTAs -->
                <div class="mt-8 flex flex-wrap items-center gap-4">
                    <a href="#about"
                        class="inline-flex items-center justify-center px-6 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        {{ 'about.title' | translate }}
                    </a>
                    <a href="#contact"
                        class="inline-flex items-center justify-center px-6 py-3.5 rounded-xl bg-white/80 dark:bg-white/10 hover:bg-white dark:hover:bg-white/20 text-gray-900 dark:text-white font-medium border border-gray-300/40 dark:border-white/10 backdrop-blur-md shadow-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        {{ 'NAVBAR.CONTACT' | translate }}
                    </a>
                </div>

                <!-- Social Profile Links -->
                <div class="mt-8">
                    <ul class="flex items-center space-x-4">
                        <li>
                            <a href="#" (click)="redirectToMedia('linkedin'); $event.preventDefault()"
                                aria-label="LinkedIn Profile"
                                class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-white/80 dark:bg-white/10 hover:bg-indigo-600 dark:hover:bg-indigo-600 text-gray-700 dark:text-gray-200 hover:text-white dark:hover:text-white transition-all duration-200 shadow-md backdrop-blur-md border border-gray-200/50 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <svg class="w-5 h-5 fill-current" role="img" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M218.123122,218.127392 L180.191928,218.127392 L180.191928,158.724263 C180.191928,144.559023 179.939053,126.323993 160.463756,126.323993 C140.707926,126.323993 137.685284,141.757585 137.685284,157.692986 L137.685284,218.123441 L99.7540894,218.123441 L99.7540894,95.9665207 L136.168036,95.9665207 L136.168036,112.660562 L136.677736,112.660562 C144.102746,99.9650027 157.908637,92.3824528 172.605689,92.9280076 C211.050535,92.9280076 218.138927,118.216023 218.138927,151.114151 L218.123122,218.127392 Z M56.9550587,79.2685282 C44.7981969,79.2707099 34.9413443,69.4171797 34.9391618,57.260052 C34.93698,45.1029244 44.7902948,35.2458562 56.9471566,35.2436736 C69.1040185,35.2414916 78.9608713,45.0950217 78.963054,57.2521493 C78.9641017,63.090208 76.6459976,68.6895714 72.5186979,72.8184433 C68.3913982,76.9473153 62.7929898,79.26748 56.9550587,79.2685282 M75.9206558,218.127392 L37.94995,218.127392 L37.94995,95.9665207 L75.9206558,95.9665207 L75.9206558,218.127392 Z M237.033403,0.0182577091 L18.8895249,0.0182577091 C8.57959469,-0.0980923971 0.124827038,8.16056231 -0.001,18.4706066 L-0.001,237.524091 C0.120519052,247.839103 8.57460631,256.105934 18.8895249,255.9977 L237.033403,255.9977 C247.368728,256.125818 255.855922,247.859464 255.999,237.524091 L255.999,18.4548016 C255.851624,8.12438979 247.363742,-0.133792868 237.033403,0.000790807055"></path>
                                </svg>
                            </a>
                        </li>
                        <li>
                            <a href="#" (click)="redirectToMedia('github'); $event.preventDefault()"
                                aria-label="GitHub Profile"
                                class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-white/80 dark:bg-white/10 hover:bg-indigo-600 dark:hover:bg-indigo-600 text-gray-700 dark:text-gray-200 hover:text-white dark:hover:text-white transition-all duration-200 shadow-md backdrop-blur-md border border-gray-200/50 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385c.6.105.825-.255.825-.57c0-.285-.015-1.23-.015-2.235c-3.015.555-3.795-.735-4.035-1.41c-.135-.345-.72-1.41-1.23-1.695c-.42-.225-1.02-.78-.015-.795c.945-.015 1.62.87 1.845 1.23c1.08 1.815 2.805 1.305 3.495.99c.105-.78.42-1.305.765-1.605c-2.67-.3-5.46-1.335-5.46-5.925c0-1.305.465-2.385 1.23-3.225c-.12-.3-.54-1.53.12-3.18c0 0 1.005-.315 3.3 1.23c.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23c.66 1.65.24 2.88.12 3.18c.765.84 1.23 1.905 1.23 3.225c0 4.605-2.805 5.625-5.475 5.925c.435.375.81 1.095.81 2.22c0 1.605-.015 2.895-.015 3.3c0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" fill="currentColor"/>
                                </svg>
                            </a>
                        </li>
                        <li>
                            <a href="#" (click)="redirectToMedia('x'); $event.preventDefault()"
                                aria-label="X Twitter Profile"
                                class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-white/80 dark:bg-white/10 hover:bg-indigo-600 dark:hover:bg-indigo-600 text-gray-700 dark:text-gray-200 hover:text-white dark:hover:text-white transition-all duration-200 shadow-md backdrop-blur-md border border-gray-200/50 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <svg class="w-5 h-5 fill-current" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 93 92">
                                    <path d="M50.7568 42.1716L69.3704 21H64.9596L48.7974 39.383L35.8887 21H21L40.5205 48.7983L21 71H25.4111L42.4788 51.5869L56.1113 71H71L50.7557 42.1716H50.7568ZM44.7152 49.0433L42.7374 46.2752L27.0005 24.2492H33.7756L46.4755 42.0249L48.4533 44.7929L64.9617 67.8986H58.1865L44.7152 49.0443V49.0433Z"></path>
                                </svg>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- ══════════════════════════════════════════════════════
         SECTION 2: WORK (#work)
         ══════════════════════════════════════════════════════ -->
    <section id="work"
        class="work-section page-content min-h-screen flex flex-col items-center justify-center text-white"
        style="scroll-margin-top: 80px;">
        <app-services></app-services>
    </section>

    <!-- ══════════════════════════════════════════════════════
         SECTION 3: ABOUT (#about)
         ══════════════════════════════════════════════════════ -->
    <section id="about"
        class="about-section page-content min-h-screen flex flex-col items-center justify-center text-white"
        style="scroll-margin-top: 80px;">
        <app-about></app-about>
    </section>

    <!-- ══════════════════════════════════════════════════════
         SECTION 4: EXPERIENCE (#experience)
         ══════════════════════════════════════════════════════ -->
    <section id="experience"
        class="experience-section page-content min-h-screen flex flex-col items-center justify-center text-white"
        style="scroll-margin-top: 80px;">
        <app-resume></app-resume>
    </section>

    <!-- ══════════════════════════════════════════════════════
         SECTION 5: CONTACT (#contact)
         ══════════════════════════════════════════════════════ -->
    <section id="contact"
        class="contact-section page-content min-h-screen flex flex-col items-center justify-center text-white"
        style="scroll-margin-top: 80px;">
        <app-contact></app-contact>
    </section>

</div>
