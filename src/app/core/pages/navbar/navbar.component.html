<nav
[ngClass]="{ 'lg:bg-opacity-90 fo	sm:bg-white ': activeSection !== 'home-section' }"

 class="bg-white border-gray-200 dark:bg-[#22223b] fixed top-0 left-0 w-full z-50">

  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a href="" class="justify-start">
      <app-dark-mode-toggle></app-dark-mode-toggle>
    </a>
    <a routerLink="/" 
    class="flex items-center space-x-3 rtl:space-x-reverse"
    [ngClass]="{ 'text-blue-700 font-bold': activeSection === 'home-section' }"
    >
      <span class="self-center lg:text-2xl md:text-xl py-4 text-center sm:text-base font-semibold whitespace-nowrap dark:text-white">Kamal Naim</span>
    
    </a>
   
    <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
      <button type="button"
      (click)="scrollToSection('contact-section')"
      [ngClass]="{ 'text-blue-700 dark:text-blue-700 font-bold': activeSection === 'home-section' }"
        class="text-white dark:text-gray-700 text-pretty dark:hover:text-blue-200 md:text-base lg:text-xl sm:text-sm bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg  px-4 py-2 text-center dark:bg-blue-200 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
        {{ 'NAVBAR.CONTACT' | translate }}
      </button>
      
      <button 
        (click)="toggleMenu()"
        type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
        aria-controls="navbar-cta" 
        [attr.aria-expanded]="isMenuOpen">
        <span class="sr-only">Open main menu</span>
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15" />
        </svg>
      </button>
    </div>
    
    <div 
      class="items-center justify-between w-full md:flex md:w-auto md:order-1" 
      [ngClass]="{'hidden': !isMenuOpen}"
      id="navbar-cta">
      <ul
        class="flex flex-col font-medium p-4 md:p-0 mt-4 border border-gray-100 rounded-lg md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0   dark:border-gray-700">
        <li>
          <a 
          (click)="scrollToSection('home-section')" 
          [ngClass]="{
            'text-blue-700 dark:text-blue-500': activeSection === 'home-section',
            'text-gray-900 dark:text-white': activeSection !== 'home-section'
          }"
            class="block py-2 px-3 md:p-0 md:text-xl lg:text-2xl sm:text-sm text-gray-900 rounded md:hover:bg-blue-200 hover:border-blue-200 hover:p-1   md:hover:text-blue-700 md:dark:hover:text-blue-500 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">                  
                 {{ 'NAVBAR.HOME' | translate }}          </a>
        </li>
        <li>
          <a 

          (click)="scrollToSection('about-section')"
          [ngClass]="{
            'text-blue-700 dark:text-blue-500': activeSection === 'about-section',
            'text-gray-900 dark:text-white': activeSection !== 'about-section'
          }"
            class="block py-2 px-3 md:p-0 md:text-xl lg:text-2xl sm:text-sm text-gray-900 rounded md:hover:bg-blue-200 hover:border-blue-200 hover:p-1   md:hover:text-blue-700 md:dark:hover:text-blue-500 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">            
            {{ 'NAVBAR.ABOUT' | translate }}
          </a>
        </li>
        <li>
          <a 
          (click)="scrollToSection('resume-section')"
          [ngClass]="{
            'text-blue-700 dark:text-blue-500': activeSection === 'resume-section',
            'text-gray-900 dark:text-white': activeSection !== 'resume-section'
          }"
                        class="block py-2 px-3 md:p-0 md:text-xl lg:text-2xl sm:text-sm text-gray-900 rounded md:hover:bg-blue-200 hover:border-blue-200 hover:p-1   md:hover:text-blue-700 md:dark:hover:text-blue-500 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">   {{ 'NAVBAR.RESUME' | translate }}
         </a>
        </li>
        <li>
          <a 
          (click)="scrollToSection('services-section')"
          [ngClass]="{
            'text-blue-700 dark:text-blue-500': activeSection === 'services-section',
            'text-gray-900 dark:text-white': activeSection !== 'services-section'
          }"
      
            class="block py-2 px-3 md:p-0 md:text-xl lg:text-2xl sm:text-sm text-gray-900 rounded md:hover:bg-blue-200 hover:border-blue-200 hover:p-1   md:hover:text-blue-700 md:dark:hover:text-blue-500 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700"

           >
           {{ 'NAVBAR.SERVICES' | translate }}
          </a>
        </li>
        <li>
         <app-select></app-select>
        </li>
      </ul>
    </div>
  </div>
</nav>
